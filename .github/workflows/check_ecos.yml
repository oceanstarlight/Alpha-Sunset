name: check-ecos

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx==0.28.1 pyyaml==6.0.3 python-dotenv==1.2.4
      - run: python scripts/check_ecos.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
