# 임계치·가중치 초기값. P8 백테스트에서 보정한다. (plans.md 5장)

markets:                      # 표시 범위 선택 (수집은 로컬·글로벌 모두 항상 수행)
  local: {code: KR, name: 대한민국, lat: 36.0, lon: 127.8}
  default_view: local

sentinel:
  market:                     # 시그널 A (FRED)
    series: [VIXCLS, T10Y2Y, DGS10, DEXKOUS, DCOILWTICO, DTWEXBGS]
    # 신용스프레드: HY OAS(최근 3년만 공개)를 우선, 이력 부족 시 BAA10Y로 대체
    credit_spread:
      primary: BAMLH0A0HYM2
      fallback: BAA10Y
    diff_series: [T10Y2Y, DGS10, BAMLH0A0HYM2, BAA10Y]   # 수준 차분, 나머지는 변화율
    lookback_days: 252
    min_history: 200          # z-score 계산에 필요한 최소 관측치
    stale_days: 5             # 마지막 관측이 이보다 오래되면 제외
    z_threshold: 2.5
    min_series: 2
    z_extreme: 4.0
  news:                       # 시그널 B (라이브: GDELT, 백테스트: 사건 카드)
    baseline_days: 30
    z_threshold: 3.0
    min_sources: 20
    card_active_days: 14      # 백테스트: 사건 카드 date부터 B 활성 유지 기간
    cluster_jaccard: 0.5
    request_interval_sec: 10  # GDELT 요청 간격 (5초당 1회 제한, 공유 IP 대비 여유)
    queries:
      banking_stress: '"bank run" OR "bank failure" OR "deposit outflow"'
      credit_event: '"default" OR "bankruptcy filing" OR "chapter 11"'
      liquidity_crisis: '"liquidity crunch" OR "credit crunch" OR "funding stress"'
      geopolitical: '"invasion" OR "military strike" OR "sanctions"'
      trade_policy: '"tariff" OR "trade war" OR "export controls"'
      pandemic: '"pandemic" OR "outbreak" OR "lockdown"'
      fx_shock: '"currency crisis" OR "won plunges" OR "currency plunge"'
      rate_shock: '"bond selloff" OR "yields surge"'
  flow:                       # 시그널 C (자금 흐름, 사전 등록 v2)
    enabled: true
    # WIMFNS(기관 MMF)는 2021 중단으로 품질 기준 미달 → 제외 (사전 등록 v3, 사용자 결정)
    series: [WRMFNS, DPSACBW027SBOG, WMTSECL1, WRESBAL]
    publication_lag_days: {WRMFNS: 45, DPSACBW027SBOG: 10, WMTSECL1: 3, WRESBAL: 3}
    lookback_obs: 52
    min_obs: 40
    z_threshold: 3.0
  merge_window_hours: 72
  replay:                     # P3 재생 범위 (사건일 기준)
    days_before: 30
    days_after: 14

llm:
  requests_per_minute: 14   # Gemini 무료 등급 분당 15회 제한
  rate_limit_retries: 5     # 429 응답 시 서버가 알려준 시간만큼 대기 후 재시도

matcher:
  top_k: 30
  batch_size: 8               # 조항 5~10개씩 배치 판정
  partial_weight: 0.5
  requery_fit_below: 0.4
  low_confidence_below: 0.5
  max_retries: 2

exposure:
  top_n: 10
  uncertainty:
    direct: 0.0
    proxy: 0.3
    counterparty: 0.5
  uncertainty_penalty: 0.5
  requery_uncertain_ratio: 0.5
  uncertain_path_threshold: 0.5   # 이 값 이상 uncertainty 경로를 '불확실 경로'로 집계
  relevance_weights:              # 규칙 기반 연관도 가중치 (합 1)
    region: 0.4
    sector: 0.35
    asset_class: 0.25
  global_region_score: 0.5        # 사건 지역에 GLOBAL이 있으면 지역 일치 점수
  min_relevance: 0.05
  entity_candidates_max: 300      # LLM 이름 매칭에 넘길 최대 발행자 수
  excluded_asset_cats: [STIV]     # 증권대여 담보 등 단기투자기구는 노출에서 제외
  core_paths_max: 5               # 핵심 경로(구체 지역 일치) 별도 표시 개수

backtest:
  random_calm:                # 무작위 평상 구간 (오경보 측정)
    seed: 42
    n_quarters: 10
    exclude_days: 180         # 백테스트 사건일 ±180일 제외
    start: "2007-01-01"
    end: "2025-12-31"

learner:
  half_life_days: 180
  explore_c: 0.2
  weights:
    cite: 0.4
    feedback: 0.4
    recency: 0.2
  boost: 0.3
  protected_floor: 0.5

orchestrator:
  max_steps: 10

korea:                        # 로컬(대한민국) 상시 감시 — 사전 등록 v5
  market:                     # A_kr (ECOS 일별). 항목 코드는 scripts/check_ecos.py로 확인 완료 (2026-10-18)
    verified: true
    series:
      KOSPI:  {stat: 802Y001, item: "0001000", change: pct}
      USDKRW: {stat: 731Y001, item: "0000001", change: pct}
      KTB3Y:  {stat: 817Y002, item: "010200000", change: diff}
      CORP_AA3Y: {stat: 817Y002, item: "010300000", change: diff}
      CD91:   {stat: 817Y002, item: "010502000", change: diff}
    derived:
      CREDIT_KR: [CORP_AA3Y, KTB3Y]   # 회사채 AA- 3년 − 국고채 3년
    signal_series: [KOSPI, USDKRW, KTB3Y, CREDIT_KR, CD91]
  flow:                       # C_kr: 외국인 순매수 (공식 무료 소스 확인 후 활성)
    verified: true
    series:
      FOREIGN_NET_KOSPI: {stat: 802Y001, item: "0030000", change: level}
    cumulative_days: 5
  news:                       # B_kr: Google 뉴스 RSS (30분마다)
    window_hours: 24
    baseline_days: 30
    baseline_min_points: 20   # 같은 시간대(±1시간) 기준점이 이만큼 쌓이기 전에는 판단 불가
    z_threshold: 3.0
    min_sources: 10           # 사용자 결정 (v5 Q2)
    queries:
      banking_stress: 뱅크런 | 예금 인출 사태 | 은행 파산
      credit_event: 부도 | 디폴트 | 회생 신청 | 채무불이행
      liquidity_crisis: 유동성 위기 | 자금 경색 | 단기자금시장 경색
      fx_shock: 환율 급등 | 원화 급락 | 외환위기
      trade_policy: 관세 부과 | 수출 규제 | 무역 분쟁
      geopolitical: 전쟁 | 군사 도발 | 대북 제재
      pandemic: 팬데믹 | 감염병 확산 | 봉쇄 조치
  dart:                       # 신용 공시 → 사건 경고 (v5 Q3: 단독은 경고만)
    report_keywords: [부도발생, 회생절차개시신청, 회생절차개시결정, 기한의이익상실, 영업정지, 채권은행, 해산사유발생, 파산신청]
    listed_classes: [Y, K]     # 유가증권·코스닥
    confirm_hours: 48          # 이 시간 안에 기업명 기사 언론사 min_sources곳 이상이면 사건 확정으로 승격
  linkage:                    # 해외-한국 연관성 근거 (v5 linkage_evidence)
    window: 252
    history_years: 5
    weak_abs_corr: 0.2
    pairs:
      - [VIXCLS, KOSPI]
      - [CREDIT_GLOBAL, CREDIT_KR]
      - [DGS10, KTB3Y]
      - [DTWEXBGS, USDKRW]
  alerts:
    dedupe_hours: 24
    failure_streak_warn: 3
